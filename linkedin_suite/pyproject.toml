[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "linkedin-suite"
version = "0.1.0"
description = "Official LinkedIn API Suite with FastMCP Server and Rich CLI"
authors = [{ name = "Agent Workspace" }]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "mcp>=1.0.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "rich>=13.7.0",
]

[project.scripts]
linkedin-cli = "src.cli:main"
linkedin-mcp = "src.server:main"
